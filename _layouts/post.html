---
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — Chad Rosser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ee;
      --surface: #ffffff;
      --ink: #18181b;
      --ink2: #52525b;
      --ink3: #a1a1aa;
      --accent: #1d4ed8;
      --border: rgba(0,0,0,0.08);
      --border2: rgba(0,0,0,0.14);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Geist', sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--border2);
      border-radius: 100px;
      padding: 6px 8px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.07);
      white-space: nowrap;
    }

    .nav-link {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink2);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 100px;
      transition: all 0.15s ease;
    }

    .nav-link:hover { color: var(--ink); background: var(--bg); }

    .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }

    .page { max-width: 680px; margin: 0 auto; padding: 0 32px; }

    .post-header {
      padding-top: 120px;
      padding-bottom: 48px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 56px;
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .post-back {
      font-size: 0.8rem;
      color: var(--ink3);
      text-decoration: none;
      transition: color 0.15s;
    }

    .post-back:hover { color: var(--ink); }

    .post-cat {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink3);
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 5px;
      padding: 3px 10px;
    }

    .post-date { font-size: 0.78rem; color: var(--ink3); }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .post-body { padding-bottom: 96px; }

    .post-body p {
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.82;
      color: var(--ink2);
      margin-bottom: 24px;
    }

    .post-body h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin: 48px 0 16px;
    }

    .post-body h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      margin: 32px 0 12px;
    }

    .post-body ul, .post-body ol {
      padding-left: 20px;
      margin-bottom: 24px;
    }

    .post-body li {
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.75;
      color: var(--ink2);
      margin-bottom: 6px;
    }

    .post-body a { color: var(--accent); text-decoration: underline; }

    .post-body code {
      font-size: 0.875rem;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .post-body pre {
      background: var(--ink);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
      overflow-x: auto;
    }

    .post-body pre code {
      background: none;
      border: none;
      color: #f5f3ee;
      font-size: 0.875rem;
      padding: 0;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 40px 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .footer-logo {
      font-family: 'Instrument Serif', serif;
      font-size: 1.1rem;
      color: var(--ink);
      text-decoration: none;
    }

    .footer-links { display: flex; gap: 20px; }
    .footer-links a { font-size: 0.82rem; color: var(--ink3); text-decoration: none; transition: color 0.15s; }
    .footer-links a:hover { color: var(--ink); }
    .footer-copy { font-size: 0.78rem; color: var(--ink3); }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-link">Home</a>
  <div class="nav-dot"></div>
  <a href="/#about" class="nav-link">About</a>
  <div class="nav-dot"></div>
  <a href="/#projects" class="nav-link">Projects</a>
  <div class="nav-dot"></div>
  <a href="/#writing" class="nav-link active">Writing</a>
  <div class="nav-dot"></div>
  <a href="/#resume" class="nav-link">Résumé</a>
</nav>

<div class="page">
  <div class="post-header">
    <div class="post-meta">
      <a href="/#writing" class="post-back">← Back</a>
      <span class="post-cat">{{ page.categories | first }}</span>
      <span class="post-date">{{ page.date | date: "%b %d, %Y" }}</span>
    </div>
    <h1>{{ page.title }}</h1>
  </div>
  <div class="post-body">
    {{ content }}
  </div>
  <footer>
    <a href="/" class="footer-logo">Chad Rosser</a>
    <div class="footer-links">
      <a href="https://github.com/chadrosser" target="_blank">GitHub</a>
      <a href="https://linkedin.com/in/chadrosser" target="_blank">LinkedIn</a>
      <a href="mailto:rosserchad@gmail.com">Email</a>
    </div>
    <span class="footer-copy">© 2026 Chad Rosser</span>
  </footer>
</div>

</body>
</html>
